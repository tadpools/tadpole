name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18"

      - run: gleam deps download

      # The quality bar (CONTRIBUTING.md): zero warnings in Tadpole's own
      # code. Warnings from dependency sources are upstream's to fix.
      - name: Build (zero warnings in tadpole code)
        run: sh scripts/check-warnings.sh

      - name: Test
        run: gleam test

      - name: Check formatting
        run: |
          gleam format
          git diff --exit-code -- '*.gleam' || {
            echo '::error::Code is not gleam-format canonical. Run: gleam format'
            exit 1
          }

      - name: Docs build
        run: gleam docs build
